<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Compass</title>
  <style>
    body { background: #fff; color: #000; font-family: sans-serif; line-height: 1.5; max-width: 860px; margin: 40px auto; padding: 0 16px; }
    textarea { width: 100%; height: 120px; box-sizing: border-box; border: 1px solid #888; padding: 8px; font: inherit; color: #000; background: #fff; }
    button { margin-top: 8px; padding: 6px 16px; border: 1px solid #000; background: #000; color: #fff; font: inherit; cursor: pointer; }
    .error { margin-top: 16px; padding: 8px 12px; border: 1px solid #000; font-weight: bold; }
    section { margin-top: 28px; border-top: 2px solid #000; padding-top: 4px; }
    section h2 { font-size: 1.2em; margin: 8px 0; }
    h3 { font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.04em; color: #888; margin: 16px 0 4px; }
    p, ul { margin: 0; }
    ul { padding-left: 20px; }
    .none { color: #888; font-style: italic; }
    table { border-collapse: collapse; width: 100%; font-size: 0.95em; }
    th, td { border: 1px solid #888; padding: 6px 8px; text-align: left; vertical-align: top; }
    a { color: #000; }
    a.url { overflow-wrap: anywhere; }
    th { background: #000; color: #fff; font-weight: normal; }
    .scroll { overflow-x: auto; }
    details { margin-top: 28px; color: #888; }
    pre { padding: 12px; border: 1px solid #888; color: #000; white-space: pre-wrap; }
      .req { margin-top: 24px; border-top: 2px solid #000; padding-top: 8px; }
    .status { display: inline-block; padding: 0 6px; border: 1px solid #000; font-size: 0.85em; }
    .failed { background: #000; color: #fff; }
    input[type=text], input[type=number], select { font: inherit; padding: 2px 4px; border: 1px solid #888; background: #fff; color: #000; max-width: 100%; box-sizing: border-box; }
    input.num { width: 6em; }
    td.rationale { font-size: 0.9em; color: #333; min-width: 12em; }
    .hint { color: #555; font-size: 0.9em; margin-top: 4px; }
    .steps { color: #555; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>LLM Compass</h1>
  {% block content %}{% endblock %}
</body>
</html>
